// Graviton / Black Hole: an add-on for Re:AcademyCraft 1.5.0 (Minecraft 1.20.1 / Forge 47.4.10).
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'dev.blackhole.addon'
version = '1.0.0'
base { archivesName = 'blackhole-addon-forge-1.20.1' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            mods { blackhole { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { blackhole { source sourceSets.main } }
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
}

def academyVersion = project.findProperty('academyVersion') ?: '1.5.0'

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    def fullJar = file("libs/re-academycraft-forge-1.20.1-${academyVersion}.jar")
    def apiOnly = project.hasProperty('academyApiOnly') || !fullJar.exists()
    implementation fg.deobf("blank:re-academycraft-forge-1.20.1:${academyVersion}" + (apiOnly ? ':api' : ''))
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

tasks.named('jar', Jar) {
    finalizedBy 'reobfJar'
}
